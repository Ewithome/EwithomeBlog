name: Deploy Hexo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: |
          pnpm run clean
          pnpm run build

      - name: Deploy to Ewithome.github.io
        uses: peaceiris/actions-hexo-deploy@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: Ewithome/Ewithome.github.io
          publish_branch: gh-pages
          publish_dir: ./public
          commit_message: "site: deploy from GitHub Actions"
