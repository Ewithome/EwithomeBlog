name: Deploy Hexo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DEPLOY_KEY secret
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_KEY secret is missing. Add it in EwithomeBlog Settings - Secrets - Actions."
            exit 1
          fi
          echo "DEPLOY_KEY is set."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run clean
          pnpm run build

      - name: Deploy to Ewithome.github.io
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          repository-name: Ewithome/Ewithome.github.io
          branch: main
          single-commit: true
          clean: true
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          commit-message: site deploy from GitHub Actions
